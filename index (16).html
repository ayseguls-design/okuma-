olor: #dfe6e9; box-shadow: none; }\n        .ayin-baslik { font-size: 16px; font-weight: bold; color: #b7791f; }\n        .ayin-isim { color: #d35400; }\n        .ayin-dk { font-size: 13px; color: #7f8c8d; font-weight: normal; }\n        .ayin-ogrencisi-kutu details { background: transparent; border: none; margin-top: 10px; text-align: left; padding: 0; }\n        .ayin-ogrencisi-kutu summary { color: #b7791f; }\n        .ayin-siralama { margin-top: 8px; }\n        .ayin-siralama-satir { display: flex; justify-content: space-between; padding: 5px 10px; font-size: 13px; border-bottom: 1px dashed #eee; color: #555; }\n        .ayin-siralama-satir.birinci { font-weight: bold; color: #d35400; }\n\n        /* ===== AYLIK GELİŞİM ROZETİ ===== */\n        .gelisim-rozet { padding: 8px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; margin-bottom: 10px; }\n        .gelisim-pozitif { background: #eafaf1; color: #27ae60; border-left: 4px solid #27ae60; }\n        .gelisim-negatif { background: #fdedec; color: #e74c3c; border-left: 4px solid #e74c3c; }\n        .gelisim-notr { background: #f4f6f7; color: #7f8c8d; border-left: 4px solid #bdc3c7; }\n    \u003c/style>\n\u003c/head>\n\u003cbody>\n\n    \u003ch1 class=\"header-title\">👩‍🏫 Sınıf Yönetim Paneli\u003c/h1>\n\n    \u003cdiv class=\"stats-container\">\n        \u003cdiv class=\"stat-box\"> \u003ch3>Günlük Okuma\u003c/h3> \u003cspan id=\"stat-gunluk\">%0\u003c/span> \u003c/div>\n        \u003cdiv class=\"stat-box\"> \u003ch3>Haftalık Okuma\u003c/h3> \u003cspan id=\"stat-haftalik\">%0\u003c/span> \u003c/div>\n        \u003cdiv class=\"stat-box\"> \u003ch3>Aylık Okuma\u003c/h3> \u003cspan id=\"stat-aylik\">%0\u003c/span> \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"bulk-actions\">\n        \u003cspan style=\"font-weight:bold; color:#2c3e50;\">⚙️ Toplu İşlemler:\u003c/span>\n        \u003cselect id=\"topluKartSec\">\n            \u003coption value=\"İyilik Tohumu\">🌱 İyilik Tohumu\u003c/option>\n            \u003coption value=\"İyilik Muhafızı\">🛡️ İyilik Muhafızı\u003c/option>\n            \u003coption value=\"İyilik Çınarı\">🌳 İyilik Çınarı\u003c/option>\n            \u003coption value=\"Çalışkan Karınca\">🐜 Çalışkan Karınca\u003c/option>\n            \u003coption value=\"Süper Karınca\">🦸 Süper Karınca\u003c/option>\n            \u003coption value=\"Atom Karınca\">⚛️ Atom Karınca\u003c/option>\n        \u003c/select>\n        \u003cbutton class=\"btn-green\" onclick=\"tumSinifaKartGonder()\">📢 Tüm Sınıfa Gönder\u003c/button>\n        \u003cspan style=\"color:#bdc3c7;\">|\u003c/span>\n        \u003cbutton onclick=\"tumunuSec()\" style=\"background:#eee; border:none; padding:10px; border-radius:8px;\">☑️ Hepsini Seç\u003c/button>\n        \u003cbutton class=\"btn-blue\" onclick=\"secilenlereKartGonder()\">Seçilenlere Gönder\u003c/button>\n        \u003cspan style=\"color:#bdc3c7;\">|\u003c/span>\n        \u003cbutton class=\"btn-danger\" onclick=\"yeniDonemeBasla()\">🗑️ Yeni Döneme Başla (Tümünü Sıfırla)\u003c/button>\n    \u003c/div>\n\n    \u003cdiv class=\"class-tabs\">\n        \u003cbutton class=\"tab-btn\" onclick=\"sinifYukle('3A', this)\">3/A\u003c/button>\n        \u003cbutton class=\"tab-btn\" onclick=\"sinifYukle('3B', this)\">3/B\u003c/button>\n        \u003cbutton class=\"tab-btn\" onclick=\"sinifYukle('3C', this)\">3/C\u003c/button>\n    \u003c/div>\n\n    \u003cdiv id=\"ayinOgrencisiAlani\">\u003c/div>\n\n    \u003cdiv id=\"panoAlani\" style=\"max-width:700px; margin:0 auto 20px;\">\u003c/div>\n\n    \u003cdiv id=\"loading\">Veriler Firebase'den çekiliyor... ⏳\u003c/div>\n    \u003cdiv id=\"studentsContainer\" class=\"student-grid\">\u003c/div>\n\n    \u003cdiv id=\"historyModal\" class=\"modal\">\n        \u003cdiv class=\"modal-content\">\n            \u003cspan class=\"close-modal\" onclick=\"modaliKapat()\">&times;\u003c/span>\n            \u003ch2 id=\"modalTitle\" style=\"margin-top:0; border-bottom:2px solid #eee; padding-bottom:10px;\">Öğrenci Raporu\u003c/h2>\n            \n            \u003cdiv class=\"report-tabs\">\n                \u003cbutton class=\"rep-btn active\" id=\"btnHafta\" onclick=\"raporCiz(7)\">📅 Son 1 Hafta (7 Gün)\u003c/button>\n                \u003cbutton class=\"rep-btn\" id=\"btnAy\" onclick=\"raporCiz(28)\">🗓️ Son 4 Hafta (Aylık)\u003c/button>\n            \u003c/div>\n\n            \u003cdiv class=\"report-table-wrapper\" id=\"modalBody\">\u003c/div>\n            \u003cbutton id=\"downloadCsvBtn\" class=\"download-btn\" onclick=\"csvIndir()\">📥 Raporu Excel (CSV) İndir\u003c/button>\n        \u003c/div>\n    \u003c/div>\n\n    \u003cscript type=\"module\">\n        import { initializeApp } from \"https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js\";\n        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, deleteDoc, doc, where, getDoc, setDoc, updateDoc } from \"https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js\";\n\n        // ===== PANO / KARINCA MODÜLÜ (pano.js içeriği) =====\n// Ortak modül: pano (bugünün okunan kitapları) + Çalışkan Karınca otomatik ödülü\n// Hem ogretmen.html hem veli.html tarafından kullanılır.\n\nconst KARINCA = \"Çalışkan Karınca\";\n\n// Sınıf listeleri (veli ekranında öğrencinin sınıfını bulmak için)\nconst SINIFLAR = {\n    \"3A\": [ \"AHMED ALKIŞ\", \"AHMET KEREM DAVRAN\", \"AHMET TUNA ÇAKIR\", \"ALPARSLAN ALİ YILANCI\", \"ARİF FEHMİ AKISKALI\", \"ARİF KAĞAN ÖZTÜRK\", \"AYŞE HÜMEYRA SALAR\", \"DİLEK KIRMIZI\", \"EYÜP FARUK ALKANAT\", \"GÜLDEHAN VERA DEMİRBİLEK\", \"HATİCE ZÜMRA ÖKSÜZ\", \"MEHMET HİLMİ YAZICI\", \"MEHMET SELİM HAN ERDOĞAN\", \"MERYEM SARE ÇAĞLAK\", \"YUSUF SELİM MERCAN\", \"ZEYNEP HÜMA SALİHOĞLU\", \"EMİR ELBUĞA\" ],\n    \"3B\": [ \"AHMET ASAF GEDİK\", \"AHMET TUNA GÜVEN\", \"ALİ ASAF KATI\", \"ALİHAN HİLMİ ALAYLI\", \"ARİF ENES ATMACA\", \"AYŞE RANA DOKUCU\", \"BAHADIR SELİM GÖL\", \"FATMA GÜLDEREN BÜYÜKGÖKÇE\", \"MEHMET ÖMER DEMİRBAŞ\", \"MURATHAN GÜRSES\", \"NİLHAN ALPAY\", \"ÖMER BAŞIBÜYÜK\", \"ÖMER FARUK YILDIRIM\", \"SELMAN TAHA CORUT\", \"UFUK TUNA GÖREN\", \"ZEYNEP HÜMA ALBAYRAK\", \"AHMET YİĞİT BUDAK\", \"GÜLDEREN BEYZA\", \"ASEL YEŞİLYURT\" ],\n    \"3C\": [ \"AHMET EYMEN KUL\", \"AHMET SELİM COŞKUN\", \"AKHMETZAN TURLBAKY\", \"ARİF AHMET KULALAR\", \"ARİF HİLMİ ERGÜDER\", \"ASUDE DURMUŞ\", \"EMİNE REYYAN TUNCER\", \"HAMZA TUNAHAN NUROĞLU\", \"AHMET EREN ÖZTOPRAK\", \"MEHMED AGAH ERGELEN\", \"MEHMET EREN ÖZKAN\", \"NESLİŞAH SEVDE KÖKLÜ\", \"ÖMER SELİM ÇELİK\", \"ÖMER TUNA DEMİR\", \"ARİF AHMET BORA\", \"YAHYA YILDIRIM\", \"YUSUF EMİN KARAYEL\", \"ZEHRA BETÜL CAN\", \"ZEYNEP MİHRİMAH DÜZDAL\" ]\n};\n\nfunction sinifBul(ogrenciAdi) {\n    return Object.values(SINIFLAR).find(l => l.includes(ogrenciAdi)) || [ogrenciAdi];\n}\n\n// ===== 16:00 - 16:00 GÜN DÖNGÜSÜ =====\n// Hafta içi: bir önceki 16:00 - ertesi gün 16:00.\n// Hafta sonu: Cuma 16:00'da başlar, Pazartesi 16:00'da biter (Cumartesi/Pazar 16:00 yeni döngü başlatmaz).\nfunction donguBaslangic(simdi = new Date()) {\n    const d = new Date(simdi);\n    d.setHours(16, 0, 0, 0);\n    if (simdi \u003c d) d.setDate(d.getDate() - 1);\n    if (d.getDay() === 6) d.setDate(d.getDate() - 1);       // Cumartesi -> Cuma\n    else if (d.getDay() === 0) d.setDate(d.getDate() - 2);  // Pazar -> Cuma\n    return d;\n}\n\n// Döngü bitişi: Cuma başlangıcı ise Pazartesi 16:00 (+3 gün), diğer günlerde ertesi gün 16:00 (+1 gün)\nfunction donguBitis(bas) {\n    const b = new Date(bas);\n    b.setDate(b.getDate() + (bas.getDay() === 5 ? 3 : 1));\n    return b;\n}\n\nfunction donguAnahtar(d = donguBaslangic()) {\n    const p = n => String(n).padStart(2, \"0\");\n    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;\n}\n\nfunction odevDocId(ogrenci, anahtar) {\n    return `${anahtar}_${ogrenci.replace(/\\s+/g, \"_\")}`;\n}\n\nfunction sureToplam(kayit) {\n    let t = 0;\n    (kayit.okunanKitaplar || []).forEach(k => { t += parseInt(k.okumaSuresi) || 0; });\n    return t;\n}\n\nconst esc = s => String(s ?? \"\").replace(/[&\u003c>\"']/g, c => ({ \"&\": \"&amp;\", \"\u003c\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[c]));\n\n// ===== ÇALIŞKAN KARINCA OTOMATİK ÖDÜLÜ =====\n// Şart: öğretmen \"bugünkü ödevini yaptı\" işaretlemiş + döngüde en az 20 dk okuma.\n// Aynı döngüde bir kez verilir (öğretmen kartı silse bile tekrar verilmez).\nasync function karincaVer(db, ogrenci, dakika, odev) {\n    if (!odev || !odev.yapti || odev.karincaVerildi || dakika \u003c MIN_OKUMA_DK) return false;\n    const id = odevDocId(ogrenci, odev.donguAnahtar);\n    // Sabit kart kimliği: iki sayfa aynı anda tetiklese bile tek kart oluşur\n    await setDoc(doc(db, \"ogrenciKartlari\", `karinca_${id}`), {\n        ogrenci, isim: KARINCA, tarih: new Date(), otomatik: true\n    });\n    await setDoc(doc(db, \"odevDurumu\", id), { karincaVerildi: true }, { merge: true });\n    odev.karincaVerildi = true;\n    return true;\n}\n\n// ===== PANO =====\nfunction stilEkle() {\n    if (document.getElementById(\"pano-stil\")) return;\n    const s = document.createElement(\"style\");\n    s.id = \"pano-stil\";\n    s.textContent = `\n    .pano-kutu { background:#fff; border-radius:15px; padding:16px; margin:0 0 18px; box-shadow:0 4px 10px rgba(0,0,0,.05); border-top:5px solid #e67e22; text-align:left; }\n    .pano-baslik { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:0 0 4px; }\n    .pano-baslik h2 { margin:0; font-size:17px; color:#d35400; }\n    .pano-yenile { background:#f1f2f6; border:none; border-radius:8px; padding:6px 10px; cursor:pointer; font-size:12px; font-weight:bold; color:#636e72; }\n    .pano-alt { font-size:11px; color:#95a5a6; margin-bottom:10px; }\n    .pano-sayac { display:inline-block; background:#fff3cd; color:#b7791f; font-size:12px; font-weight:bold; padding:4px 10px; border-radius:20px; margin-bottom:10px; }\n    .pano-liste { display:flex; flex-direction:column; gap:8px; }\n    .pano-satir { background:#f8f9fa; border-radius:10px; padding:10px 12px; border-left:4px solid #bdc3c7; }\n    .pano-satir.tamam { border-left-color:#27ae60; background:#f1fbf5; }\n    .pano-ust { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; font-weight:bold; color:#2c3e50; }\n    .pano-dk { font-size:11px; font-weight:bold; padding:3px 8px; border-radius:12px; white-space:nowrap; background:#fdedec; color:#e74c3c; }\n    .pano-satir.tamam .pano-dk { background:#eafaf1; color:#27ae60; }\n    .pano-kitap { font-size:12px; color:#555; margin-top:4px; }\n    .pano-bos { text-align:center; color:#95a5a6; font-size:13px; padding:14px 0; }\n    `;\n    document.head.appendChild(s);\n}\n\nasync function panoCiz(db, el, ogrenciler) {\n    stilEkle();\n    const bas = donguBaslangic();\n    let html;\n    try {\n        const snap = await getDocs(query(collection(db, \"gunlukGorevler\"), where(\"tamZaman\", \">=\", bas.getTime())));\n        const sinif = new Set(ogrenciler);\n        const harita = {};\n        snap.forEach(d => {\n            const g = d.data();\n            if (!sinif.has(g.ogrenci)) return;\n            const h = harita[g.ogrenci] || (harita[g.ogrenci] = { kitaplar: [], dk: 0, zaman: 0 });\n            (g.okunanKitaplar || []).forEach(k => h.kitaplar.push(k));\n            h.dk += sureToplam(g);\n            h.zaman = Math.max(h.zaman, g.tamZaman || 0);\n        });\n\n        const okuyanlar = Object.entries(harita).sort((a, b) => b[1].zaman - a[1].zaman);\n        const satirlar = okuyanlar.map(([ad, h]) => {\n            const kitapMetni = h.kitaplar.map(k => `📚 ${esc(k.kitapAdi)} \u003cspan style=\"color:#16a085\">(${parseInt(k.okumaSuresi) || 0} dk)\u003c/span>`).join(\"\u003cbr>\");\n            return `\u003cdiv class=\"pano-satir ${h.dk >= MIN_OKUMA_DK ? \"tamam\" : \"\"}\">\n                \u003cdiv class=\"pano-ust\">\u003cspan>👤 ${esc(ad)}\u003c/span>\u003cspan class=\"pano-dk\">${h.dk} dk ${h.dk >= MIN_OKUMA_DK ? \"✅\" : \"\"}\u003c/span>\u003c/div>\n                \u003cdiv class=\"pano-kitap\">${kitapMetni}\u003c/div>\u003c/div>`;\n        }).join(\"\");\n\n        const bitis = donguBitis(bas);\n        const fmt = d => d.toLocaleDateString(\"tr-TR\", { day: \"numeric\", month: \"long\", weekday: \"long\" }) + \" 16:00\";\n        html = `\n        \u003cdiv class=\"pano-baslik\">\u003ch2>📌 Bugün Sınıfta Okunan Kitaplar\u003c/h2>\u003cbutton class=\"pano-yenile\" data-yenile>🔄 Yenile\u003c/button>\u003c/div>\n        \u003cdiv class=\"pano-alt\">${fmt(bas)} – ${fmt(bitis)} arası · Pano hafta içi her gün 16:00'da, hafta sonu ise Cuma 16:00'da başlayıp Pazartesi 16:00'da sıfırlanır\u003c/div>\n        \u003cdiv class=\"pano-sayac\">${okuyanlar.length} / ${ogrenciler.length} öğrenci kayıt girdi\u003c/div>\n        \u003cdiv class=\"pano-liste\">${satirlar || `\u003cdiv class=\"pano-bos\">Henüz kitap bilgisi girilmedi. İlk kaydı siz girin! 📖\u003c/div>`}\u003c/div>`;\n    } catch (e) {\n        console.error(\"Pano hatası:\", e);\n        html = `\u003cdiv class=\"pano-bos\">Pano yüklenemedi. Lütfen daha sonra tekrar deneyin.\u003c/div>`;\n    }\n    el.innerHTML = `\u003cdiv class=\"pano-kutu\">${html}\u003c/div>`;\n    const btn = el.querySelector(\"[data-yenile]\");\n    if (btn) btn.onclick = () => panoCiz(db, el, ogrenciler);\n}\n\n// İlk çizimi yapar, her dakika kendini yeniler. Dönen fonksiyon elle yenilemek içindir.\nfunction panoBaslat(db, el, listeFn) {\n    const yenile = () => panoCiz(db, el, listeFn());\n    yenile();\n    setInterval(() => { if (!document.hidden) yenile(); }, 60000);\n    return yenile;\n}\n\n\n        const firebaseConfig = {\n            apiKey: \"AIzaSyC0vjIP4LKJhIegqVyIlC0DBIFAsBUnPbA\",\n            authDomain: \"sinifimokuyor-f1f8d.firebaseapp.com\",\n            databaseURL: \"https://sinifimokuyor-f1f8d-default-rtdb.firebaseio.com\",\n            projectId: \"sinifimokuyor-f1f8d\",\n            storageBucket: \"sinifimokuyor-f1f8d.firebasestorage.app\",\n            messagingSenderId: \"542301780034\",\n            appId: \"1:542301780034:web:389f90fb24bea7235715db\"\n        };\n        const app = initializeApp(firebaseConfig);\n        const db = getFirestore(app);\n\n        const MIN_OKUMA_DK = 20;\n\n        const siniflar = {\n            \"3A\": [ \"AHMED ALKIŞ\", \"AHMET KEREM DAVRAN\", \"AHMET TUNA ÇAKIR\", \"ALPARSLAN ALİ YILANCI\", \"ARİF FEHMİ AKISKALI\", \"ARİF KAĞAN ÖZTÜRK\", \"AYŞE HÜMEYRA SALAR\", \"DİLEK KIRMIZI\", \"EYÜP FARUK ALKANAT\", \"GÜLDEHAN VERA DEMİRBİLEK\", \"HATİCE ZÜMRA ÖKSÜZ\", \"MEHMET HİLMİ YAZICI\", \"MEHMET SELİM HAN ERDOĞAN\", \"MERYEM SARE ÇAĞLAK\", \"YUSUF SELİM MERCAN\", \"ZEYNEP HÜMA SALİHOĞLU\", \"EMİR ELBUĞA\" ],\n            \"3B\": [ \"AHMET ASAF GEDİK\", \"AHMET TUNA GÜVEN\", \"ALİ ASAF KATI\", \"ALİHAN HİLMİ ALAYLI\", \"ARİF ENES ATMACA\", \"AYŞE RANA DOKUCU\", \"BAHADIR SELİM GÖL\", \"FATMA GÜLDEREN BÜYÜKGÖKÇE\", \"MEHMET ÖMER DEMİRBAŞ\", \"MURATHAN GÜRSES\", \"NİLHAN ALPAY\", \"ÖMER BAŞIBÜYÜK\", \"ÖMER FARUK YILDIRIM\", \"SELMAN TAHA CORUT\", \"UFUK TUNA GÖREN\", \"ZEYNEP HÜMA ALBAYRAK\", \"AHMET YİĞİT BUDAK\", \"GÜLDEREN BEYZA\", \"ASEL YEŞİLYURT\" ],\n            \"3C\": [ \"AHMET EYMEN KUL\", \"AHMET SELİM COŞKUN\", \"AKHMETZAN TURLBAKY\", \"ARİF AHMET KULALAR\", \"ARİF HİLMİ ERGÜDER\", \"ASUDE DURMUŞ\", \"EMİNE REYYAN TUNCER\", \"HAMZA TUNAHAN NUROĞLU\", \"AHMET EREN ÖZTOPRAK\", \"MEHMED AGAH ERGELEN\", \"MEHMET EREN ÖZKAN\", \"NESLİŞAH SEVDE KÖKLÜ\", \"ÖMER SELİM ÇELİK\", \"ÖMER TUNA DEMİR\", \"ARİF AHMET BORA\", \"YAHYA YILDIRIM\", \"YUSUF EMİN KARAYEL\", \"ZEHRA BETÜL CAN\", \"ZEYNEP MİHRİMAH DÜZDAL\" ]\n        };\n\n        // ===== KART SEVİYE SİSTEMİ (2 ayrı seri, her biri 3 seviye) =====\n        const kartSeviyeleri = {\n            \"İyilik Tohumu\":    { emoji: \"🌱\", gorsel: \"iyilik-tohumu.jpg\", sonraki: \"İyilik Muhafızı\" },\n            \"İyilik Muhafızı\":  { emoji: \"🛡️\", gorsel: \"iyilik-muhafizi.jpg\", sonraki: \"İyilik Çınarı\" },\n            \"İyilik Çınarı\":    { emoji: \"🌳\", gorsel: \"iyilik-cinari.jpg\", sonraki: null },\n            \"Çalışkan Karınca\": { emoji: \"🐜\", gorsel: \"caliskan-karinca.jpg\", sonraki: \"Süper Karınca\" },\n            \"Süper Karınca\":    { emoji: \"🦸\", gorsel: \"super-karinca.jpg\", sonraki: \"Atom Karınca\" },\n            \"Atom Karınca\":     { emoji: \"⚛️\", gorsel: \"atom-karinca.jpg\", sonraki: null }\n        };\n\n        let tumGorevler = [];\n        let tumKartlar = [];\n        let tumTelafiVerisi = {}; // { \"OGRENCİ_ADI\": { toplamEksik, sifirlamaTarihi, ogretmenNotu } }\n        let aktifSinif = \"3A\";\n        let seciliOgrenciRapor = \"\";\n        let odevHaritasi = {};   // { \"ÖĞRENCİ\": { yapti, karincaVerildi, donguAnahtar } } (yalnızca güncel 16:00 döngüsü)\n        let panoYenile = null;\n\n        // Güncel 16:00-16:00 döngüsünde öğrencinin toplam okuma dakikası\n        function donguDakika(ogrenci) {\n            const bas = donguBaslangic().getTime();\n            return tumGorevler.filter(g => g.ogrenci === ogrenci && g.tamZaman >= bas).reduce((t, g) => t + sureToplam(g), 0);\n        }\n\n        // ===== TELAFİ HESAPLAMA =====\n\n        function ogrenciTelafiHesapla(ogrenciAdi) {\n            const telafiKaydi = tumTelafiVerisi[ogrenciAdi] || {};\n            const manuelSifirlamaTarihi = telafiKaydi.sifirlamaTarihi || 0;\n\n            const ogrGorevleri = tumGorevler.filter(g => g.ogrenci === ogrenciAdi);\n            let toplamEksik = 0;\n\n            ogrGorevleri.forEach(g => {\n                if(g.tamZaman \u003c= manuelSifirlamaTarihi) return;\n\n                let gunSure = 0;\n                if(g.okunanKitaplar) {\n                    g.okunanKitaplar.forEach(k => {\n                        gunSure += parseInt(k.okumaSuresi) || 0;\n                    });\n                }\n                const eksik = Math.max(0, MIN_OKUMA_DK - gunSure);\n                toplamEksik += eksik;\n            });\n\n            return toplamEksik;\n        }\n\n        // ===== TELAFİ VERİSİNİ GETIR =====\n\n        async function telafiVerileriniGetir() {\n            try {\n                const snap = await getDocs(collection(db, \"telafiSureleri\"));\n                snap.forEach(d => {\n                    const data = d.data();\n                    if(data.ogrenci) {\n                        tumTelafiVerisi[data.ogrenci] = data;\n                    }\n                });\n            } catch(e) {\n                console.error(\"Telafi verileri hatası:\", e);\n            }\n        }\n\n        // ===== TELAFİ KAYDET (ÖĞRETMEN) =====\n\n        window.telafiKaydet = async function(ogrenciAdi) {\n            const idSuffix = ogrenciAdi.replace(/\\s+/g,'_');\n            const inputEl = document.getElementById(`telafiInput-${idSuffix}`);\n            const notEl = document.getElementById(`telafiNot-${idSuffix}`);\n            \n            const yeniDakika = parseInt(inputEl.value) || 0;\n            const not = notEl ? notEl.value : \"\";\n            const telafiDocId = `telafi_${idSuffix}`;\n\n            try {\n                await setDoc(doc(db, \"telafiSureleri\", telafiDocId), {\n                    ogrenci: ogrenciAdi,\n                    manuelEkDakika: yeniDakika,\n                    ogretmenNotu: not,\n                    guncellemeTarihi: new Date().getTime()\n                }, { merge: true });\n                \n                if(!tumTelafiVerisi[ogrenciAdi]) tumTelafiVerisi[ogrenciAdi] = {};\n                tumTelafiVerisi[ogrenciAdi].manuelEkDakika = yeniDakika;\n                tumTelafiVerisi[ogrenciAdi].ogretmenNotu = not;\n                \n                telafiAlaniniGuncelle(ogrenciAdi, idSuffix);\n                alert(`✅ ${ogrenciAdi} için telafi kaydedildi!`);\n            } catch(e) {\n                alert(\"Hata: \" + e.message);\n            }\n        };\n\n        // ===== TELAFİ SIFIRLA =====\n\n        window.telafiSifirla = async function(ogrenciAdi) {\n            if(!confirm(`${ogrenciAdi} için birikmiş telafi sıfırlanacak. Emin misiniz?`)) return;\n            \n            const idSuffix = ogrenciAdi.replace(/\\s+/g,'_');\n            const telafiDocId = `telafi_${idSuffix}`;\n\n            try {\n                await setDoc(doc(db, \"telafiSureleri\", telafiDocId), {\n                    ogrenci: ogrenciAdi,\n                    sifirlamaTarihi: new Date().getTime(),\n                    guncellemeTarihi: new Date().getTime()\n                }, { merge: true });\n\n                if(!tumTelafiVerisi[ogrenciAdi]) tumTelafiVerisi[ogrenciAdi] = {};\n                tumTelafiVerisi[ogrenciAdi].sifirlamaTarihi = new Date().getTime();\n\n                telafiAlaniniGuncelle(ogrenciAdi, idSuffix);\n                alert(`✅ ${ogrenciAdi} için telafi sıfırlandı!`);\n            } catch(e) {\n                alert(\"Hata: \" + e.message);\n            }\n        };\n\n        function telafiAlaniniGuncelle(ogrenciAdi, idSuffix) {\n            const toplamEksik = ogrenciTelafiHesapla(ogrenciAdi);\n            const telafiKaydi = tumTelafiVerisi[ogrenciAdi] || {};\n            const manuelEk = telafiKaydi.manuelEkDakika || 0;\n            const not = telafiKaydi.ogretmenNotu || \"\";\n            \n            const alanEl = document.getElementById(`telafiAlani-${idSuffix}`);\n            const inputEl = document.getElementById(`telafiInput-${idSuffix}`);\n            const notEl = document.getElementById(`telafiNot-${idSuffix}`);\n            const badgeEl = document.getElementById(`telafiBadge-${idSuffix}`);\n            \n            const gercekToplam = toplamEksik + manuelEk;\n\n            if(alanEl) {\n                alanEl.className = `telafi-alani ${gercekToplam === 0 ? 'temiz' : ''}`;\n            }\n            if(inputEl) inputEl.value = manuelEk;\n            if(notEl) notEl.value = not;\n            if(badgeEl) {\n                if(gercekToplam === 0) {\n                    badgeEl.className = \"telafi-temiz-badge\";\n                    badgeEl.innerText = \"✅ Telafi Yok\";\n                } else {\n                    badgeEl.className = \"telafi-borclu-badge\";\n                    badgeEl.innerText = `⏱️ ${gercekToplam} dk borç`;\n                }\n            }\n\n            const baslikEl = document.getElementById(`telafiBaslik-${idSuffix}`);\n            if(baslikEl) {\n                baslikEl.innerText = gercekToplam === 0 \n                    ? \"✅ Telafi Borcu Yok\" \n                    : `⏱️ Telafi: ${gercekToplam} dk eksik`;\n            }\n        }\n\n        // ===== YENİ DÖNEME BAŞLA (TÜM VERİLERİ SIFIRLA) =====\n\n        window.yeniDonemeBasla = async function() {\n            const onay = prompt(\"⚠️ DİKKAT! Bu işlem TÜM öğrencilerin geçmiş okuma kayıtlarını, kazandıkları kartları ve telafi verilerini KALICI OLARAK SİLECEK.\\n\\nYeni döneme temiz başlamak için kutuya büyük harflerle SİL yazın:\");\n            if (onay !== \"SİL\") { alert(\"İşlem iptal edildi.\"); return; }\n\n            document.getElementById(\"loading\").style.display = \"block\";\n            try {\n                const koleksiyonlar = [\"gunlukGorevler\", \"ogrenciKartlari\", \"telafiSureleri\"];\n                for (const kol of koleksiyonlar) {\n                    const snap = await getDocs(collection(db, kol));\n                    await Promise.all(snap.docs.map(d => deleteDoc(doc(db, kol, d.id))));\n                }\n                try {\n                    const od = await getDocs(collection(db, \"odevDurumu\"));\n                    await Promise.all(od.docs.map(d => deleteDoc(doc(db, \"odevDurumu\", d.id))));\n                } catch (e) { console.error(\"odevDurumu temizlenemedi:\", e); }\n                tumGorevler = []; tumKartlar = []; tumTelafiVerisi = {}; odevHaritasi = {};\n                alert(\"✅ Yeni döneme temiz bir başlangıç yapıldı! Tüm geçmiş veriler silindi.\");\n                verileriGetir();\n            } catch(e) {\n                alert(\"Hata: \" + e.message);\n                document.getElementById(\"loading\").style.display = \"none\";\n            }\n        };\n\n        // ===== AYLIK HESAPLAMA (AYIN ÖĞRENCİSİ + GELİŞİM) =====\n\n        function ayBaslangicBitis(ofsetAy) {\n            // ofsetAy=0 -> bu ay, ofsetAy=-1 -> geçen ay\n            const suAn = new Date();\n            const yil = suAn.getFullYear();\n            const ay = suAn.getMonth() + ofsetAy;\n            const baslangic = new Date(yil, ay, 1, 0, 0, 0, 0).getTime();\n            const bitis = new Date(yil, ay + 1, 1, 0, 0, 0, 0).getTime();\n            return { baslangic, bitis };\n        }\n\n        function ogrenciAylikDakika(ogrenciAdi, ofsetAy) {\n            const { baslangic, bitis } = ayBaslangicBitis(ofsetAy);\n            let toplam = 0;\n            tumGorevler.filter(g => g.ogrenci === ogrenciAdi && g.tamZaman >= baslangic && g.tamZaman \u003c bitis)\n                .forEach(g => {\n                    if (g.okunanKitaplar) g.okunanKitaplar.forEach(k => { toplam += parseInt(k.okumaSuresi) || 0; });\n                });\n            return toplam;\n        }\n\n        function ogrenciGelisimRozetiCiz(ogrenciAdi) {\n            const buAyDk = ogrenciAylikDakika(ogrenciAdi, 0);\n            const gecenAyDk = ogrenciAylikDakika(ogrenciAdi, -1);\n\n            if (buAyDk === 0 && gecenAyDk === 0) return \"\";\n\n            if (gecenAyDk === 0) {\n                return `\u003cdiv class=\"gelisim-rozet gelisim-notr\">🆕 Bu ay ${buAyDk} dk okudu (geçen ay kaydı yok)\u003c/div>`;\n            }\n            const fark = buAyDk - gecenAyDk;\n            if (fark > 0) {\n                return `\u003cdiv class=\"gelisim-rozet gelisim-pozitif\">📈 Geçen aya göre gelişim: +${fark} dk (${gecenAyDk} → ${buAyDk} dk)\u003c/div>`;\n            } else if (fark \u003c 0) {\n                return `\u003cdiv class=\"gelisim-rozet gelisim-negatif\">📉 Geçen aya göre düşüş: ${fark} dk (${gecenAyDk} → ${buAyDk} dk)\u003c/div>`;\n            } else {\n                return `\u003cdiv class=\"gelisim-rozet gelisim-notr\">➖ Geçen ayla aynı seviyede (${buAyDk} dk)\u003c/div>`;\n            }\n        }\n\n        function ayinOgrencisiListesi(sinifAdi) {\n            const ogrenciler = siniflar[sinifAdi];\n            let liste = ogrenciler.map(ogr => {\n                const toplamEksik = ogrenciTelafiHesapla(ogr);\n                const telafiKaydi = tumTelafiVerisi[ogr] || {};\n                const manuelEk = telafiKaydi.manuelEkDakika || 0;\n                const gercekToplam = toplamEksik + manuelEk;\n                const buAyDk = ogrenciAylikDakika(ogr, 0);\n                return { ogr, gercekToplam, buAyDk };\n            });\n            liste = liste.filter(x => x.gercekToplam === 0 && x.buAyDk > 0);\n            liste.sort((a, b) => b.buAyDk - a.buAyDk);\n            return liste;\n        }\n\n        function ayinOgrencisiCiz(sinifAdi) {\n            const alan = document.getElementById(\"ayinOgrencisiAlani\");\n            const ayAdlari = [\"Ocak\",\"Şubat\",\"Mart\",\"Nisan\",\"Mayıs\",\"Haziran\",\"Temmuz\",\"Ağustos\",\"Eylül\",\"Ekim\",\"Kasım\",\"Aralık\"];\n            const ayAdi = ayAdlari[new Date().getMonth()];\n            const liste = ayinOgrencisiListesi(sinifAdi);\n\n            if (liste.length === 0) {\n                alan.innerHTML = `\n                    \u003cdiv class=\"ayin-ogrencisi-kutu bos\">\n                        🏆 \u003cspan class=\"ayin-baslik\" style=\"color:#95a5a6;\">${ayAdi} Ayının Öğrencisi (${sinifAdi})\u003c/span>\u003cbr>\n                        \u003cspan style=\"font-size:12px; color:#999;\">Telafi borcu olmayan ve bu ay kitap okuyan aday henüz yok.\u003c/span>\n                    \u003c/div>`;\n                return;\n            }\n\n            const birinci = liste[0];\n            const siraHTML = liste.slice(0, 15).map((x, i) => `\n                \u003cdiv class=\"ayin-siralama-satir ${i === 0 ? 'birinci' : ''}\">\n                    \u003cspan>${i + 1}. ${x.ogr}\u003c/span>\n                    \u003cspan>${x.buAyDk} dk\u003c/span>\n                \u003c/div>\n            `).join('');\n\n            alan.innerHTML = `\n                \u003cdiv class=\"ayin-ogrencisi-kutu\">\n                    \u003cdiv class=\"ayin-baslik\">🏆 ${ayAdi} Ayının Öğrencisi (${sinifAdi}): \u003cspan class=\"ayin-isim\">${birinci.ogr}\u003c/span>\u003c/div>\n                    \u003cdiv class=\"ayin-dk\">${birinci.buAyDk} dk okudu · telafi borcu yok\u003c/div>\n                    \u003cdetails>\n                        \u003csummary>📊 Sıralamayı Gör (telafisiz, en çok okuyandan aza)\u003c/summary>\n                        \u003cdiv class=\"ayin-siralama\">${siraHTML}\u003c/div>\n                    \u003c/details>\n                \u003c/div>`;\n        }\n\n        // ===== YARDIMCI FONKSİYONLAR =====\n\n        function getHaftaBasligi() {\n            const bugun = new Date();\n            const gun = bugun.getDay();\n            const pztFarki = bugun.getDate() - gun + (gun === 0 ? -6 : 1);\n            const pzt = new Date(bugun.setDate(pztFarki));\n            const pzr = new Date(pzt);\n            pzr.setDate(pzt.getDate() + 6);\n            const aylar = [\"Ocak\", \"Şubat\", \"Mart\", \"Nisan\", \"Mayıs\", \"Haziran\", \"Temmuz\", \"Ağustos\", \"Eylül\", \"Ekim\", \"Kasım\", \"Aralık\"];\n            let pztGun = pzt.getDate(); let pztAy = aylar[pzt.getMonth()];\n            let pzrGun = pzr.getDate(); let pzrAy = aylar[pzr.getMonth()];\n            if (pztAy === pzrAy) return `${pztGun}-${pzrGun} ${pztAy} Haftası`;\n            else return `${pztGun} ${pztAy} - ${pzrGun} ${pzrAy} Haftası`;\n        }\n\n        function getKitapMetni(gorev) {\n            if(!gorev) return `\u003cspan style=\"color:#e74c3c\">Girilmedi\u003c/span>`;\n            if(gorev.okunanKitaplar && gorev.okunanKitaplar.length > 0) {\n                return gorev.okunanKitaplar.map(k => `\u003cstrong>${k.kitapAdi}\u003c/strong> \u003cbr>\u003cspan style=\"font-size:11px; color:#16a085;\">(${k.sayfaSayisi || 0} Sayfa / ${k.okumaSuresi || 0} Dk)\u003c/span>`).join('\u003chr style=\"margin:5px 0; border:0; border-top:1px dashed #ccc;\">');\n            }\n            return `\u003cspan style=\"color:#e74c3c\">Girilmedi\u003c/span>`;\n        }\n\n        // ===== VERİLERİ GETIR =====\n\n        async function verileriGetir() {\n            document.getElementById(\"loading\").style.display = \"block\";\n            try {\n                const qGorevler = query(collection(db, \"gunlukGorevler\"), orderBy(\"tamZaman\", \"desc\"), limit(1000));\n                const gorevSnap = await getDocs(qGorevler);\n                tumGorevler = [];\n                gorevSnap.forEach(doc => tumGorevler.push(doc.data()));\n\n                const kartSnap = await getDocs(collection(db, \"ogrenciKartlari\"));\n                tumKartlar = [];\n                kartSnap.forEach(doc => { let d = doc.data(); d.docId = doc.id; tumKartlar.push(d); });\n\n                await telafiVerileriniGetir();\n                await odevDurumlariniGetirVeKarincaVer();\n\n                document.getElementById(\"loading\").style.display = \"none\";\n                document.querySelector('.tab-btn.active') ? document.querySelector('.tab-btn.active').click() : sinifYukle('3A', document.querySelectorAll('.tab-btn')[0]); \n            } catch (error) { console.error(\"Veri hatası:\", error); }\n        }\n\n        // ===== ÖDEV DURUMU + OTOMATİK ÇALIŞKAN KARINCA =====\n\n        async function odevDurumlariniGetirVeKarincaVer() {\n            odevHaritasi = {};\n            try {\n                const anahtar = donguAnahtar();\n                const snap = await getDocs(query(collection(db, \"odevDurumu\"), where(\"donguAnahtar\", \"==\", anahtar)));\n                snap.forEach(d => { const o = d.data(); odevHaritasi[o.ogrenci] = o; });\n            } catch (e) { console.error(\"Ödev durumu okunamadı:\", e); return; }\n\n            // Ödev işaretli + 20 dk tamamlanmış ama karınca verilmemiş olanlara ver\n            for (const [ogr, odev] of Object.entries(odevHaritasi)) {\n                try {\n                    if (await karincaVer(db, ogr, donguDakika(ogr), odev)) {\n                        tumKartlar.push({ ogrenci: ogr, isim: KARINCA, docId: `karinca_${odevDocId(ogr, odev.donguAnahtar)}` });\n                    }\n                } catch (e) { console.error(\"Karınca verilemedi:\", ogr, e); }\n            }\n        }\n\n        window.odevIsaretle = async function(ogrenci, cb) {\n            const anahtar = donguAnahtar();\n            const idSuffix = ogrenci.replace(/\\s+/g, '_');\n            const yapti = cb.checked;\n            try {\n                await setDoc(doc(db, \"odevDurumu\", odevDocId(ogrenci, anahtar)),\n                    { ogrenci, donguAnahtar: anahtar, yapti, tarih: new Date() }, { merge: true });\n            } catch (e) {\n                cb.checked = !yapti;\n                return alert(`❌ Ödev durumu kaydedilemedi!\\n\\nHata: ${e.message}\\n\\nFirebase güvenlik kurallarında \"odevDurumu\" koleksiyonuna yazma izni olduğunu kontrol edin.`);\n            }\n            const odev = Object.assign(odevHaritasi[ogrenci] || { karincaVerildi: false }, { ogrenci, donguAnahtar: anahtar, yapti });\n            odevHaritasi[ogrenci] = odev;\n\n            let verildi = false;\n            try { verildi = await karincaVer(db, ogrenci, donguDakika(ogrenci), odev); } catch (e) { console.error(e); }\n\n            if (verildi) {\n                tumKartlar.push({ ogrenci, isim: KARINCA, docId: `karinca_${odevDocId(ogrenci, anahtar)}` });\n                alert(`🐜 ${ogrenci} için Çalışkan Karınca kartı otomatik gönderildi!`);\n                sinifYukle(aktifSinif);\n            } else {\n                const el = document.getElementById(`odevDurum-${idSuffix}`);\n                if (el) { const d = odevDurumMetni(ogrenci); el.className = \"odev-durum \" + d.sinif; el.innerHTML = d.metin; }\n            }\n        };\n\n        function odevDurumMetni(ogrenci) {\n            const odev = odevHaritasi[ogrenci];\n            const dk = donguDakika(ogrenci);\n            if (odev && odev.karincaVerildi) return { sinif: \"ok\", metin: \"🐜 Çalışkan Karınca verildi\" };\n            if (odev && odev.yapti) return dk >= 20\n                ? { sinif: \"\", metin: \"⏳ Karınca gönderiliyor...\" }\n                : { sinif: \"\", metin: `⏳ Okuma: ${dk}/20 dk — 20 dk tamamlanınca karınca otomatik gönderilir` };\n            return { sinif: \"\", metin: `Okuma: ${dk}/20 dk · ödev işaretlenince karınca hakkı doğar` };\n        }\n\n        // ===== İSTATİSTİK =====\n\n        function istatistikHesapla(sinifAdi) {\n            const ogrenciler = siniflar[sinifAdi];\n            const suAn = new Date().getTime();\n            let gunluk = 0, haftalik = 0, aylik = 0;\n\n            ogrenciler.forEach(ogr => {\n                const ogrGorevleri = tumGorevler.filter(g => g.ogrenci === ogr);\n                if(ogrGorevleri.length > 0) {\n                    const gunFarki = (suAn - ogrGorevleri[0].tamZaman) / (1000 * 60 * 60 * 24);\n                    if(gunFarki \u003c= 1.5) gunluk++;\n                    if(gunFarki \u003c= 7) haftalik++;\n                    if(gunFarki \u003c= 30) aylik++;\n                }\n            });\n\n            const mevcud = ogrenciler.length;\n            document.getElementById(\"stat-gunluk\").innerText = `%${Math.round((gunluk/mevcud)*100)}`;\n            document.getElementById(\"stat-haftalik\").innerText = `%${Math.round((haftalik/mevcud)*100)}`;\n            document.getElementById(\"stat-aylik\").innerText = `%${Math.round((aylik/mevcud)*100)}`;\n        }\n\n        // ===== SINIF YÜKLE =====\n\n        window.sinifYukle = function(sinifAdi, btnElement) {\n            aktifSinif = sinifAdi;\n            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));\n            if(btnElement) btnElement.classList.add('active');\n\n            istatistikHesapla(sinifAdi);\n            ayinOgrencisiCiz(sinifAdi);\n            if (!panoYenile) panoYenile = panoBaslat(db, document.getElementById(\"panoAlani\"), () => siniflar[aktifSinif]);\n            else panoYenile();\n\n            const container = document.getElementById(\"studentsContainer\");\n            container.innerHTML = \"\";\n\n            const bugunTarih = new Date(); bugunTarih.setHours(0,0,0,0);\n            const dunTarih = new Date(bugunTarih); dunTarih.setDate(dunTarih.getDate() - 1);\n            const gun = bugunTarih.getDay();\n            const pztTarih = new Date(bugunTarih); pztTarih.setDate(bugunTarih.getDate() - gun + (gun === 0 ? -6 : 1));\n            const suAnMs = new Date().getTime();\n            \n            const haftaBasligi = getHaftaBasligi();\n\n            siniflar[sinifAdi].sort().forEach(ogrenci => {\n                const ogrenciGorevleri = tumGorevler.filter(g => g.ogrenci === ogrenci);\n                const idSuffix = ogrenci.replace(/\\s+/g,'_');\n                \n                let bugunGorev = null; let dunGorev = null;\n                let haftalikToplamDk = 0; let aylikToplamDk = 0;\n                let sonOkumaZamani = 999; \n                let notHTML = \"\";\n\n                ogrenciGorevleri.forEach(g => {\n                    const gZaman = new Date(g.tamZaman);\n                    const gunFarkiMs = (suAnMs - g.tamZaman) / (1000 * 60 * 60 * 24);\n\n                    let gunSureToplam = 0;\n                    if (g.okunanKitaplar) {\n                        g.okunanKitaplar.forEach(k => { gunSureToplam += parseInt(k.okumaSuresi) || 0; });\n                    }\n                    if (gZaman >= pztTarih) haftalikToplamDk += gunSureToplam;\n                    if (gunFarkiMs \u003c= 30) aylikToplamDk += gunSureToplam;\n\n                    if (gZaman >= bugunTarih) {\n                        if(!bugunGorev) bugunGorev = g; \n                        sonOkumaZamani = 0;\n                        if(g.veliNotu && !notHTML) notHTML = `\u003cdiv class=\"teacher-note\">💬 \u003cstrong>Not:\u003c/strong> ${g.veliNotu}\u003c/div>`;\n                    } else if (gZaman >= dunTarih && gZaman \u003c bugunTarih) {\n                        if(!dunGorev) dunGorev = g;\n                        if(sonOkumaZamani > 1) sonOkumaZamani = 1;\n                        if(g.veliNotu && !notHTML) notHTML = `\u003cdiv class=\"teacher-note\">💬 \u003cstrong>Not (Dün):\u003c/strong> ${g.veliNotu}\u003c/div>`;\n                    } else {\n                        if (gunFarkiMs \u003c sonOkumaZamani) sonOkumaZamani = gunFarkiMs;\n                    }\n                });\n\n                let durumRozet = `\u003cspan class=\"status-badge bg-neutral\">⚪ Başlamadı\u003c/span>`;\n                let tozlanmisMi = false;\n                if(bugunGorev || dunGorev) durumRozet = `\u003cspan class=\"status-badge bg-success\">✅ Güncel\u003c/span>`;\n                else if(ogrenciGorevleri.length > 0 && sonOkumaZamani >= 2) { durumRozet = `\u003cspan class=\"status-badge bg-danger\">❌ Bekleniyor\u003c/span>`; tozlanmisMi = true; }\n\n                const bugunKitap = getKitapMetni(bugunGorev);\n                const dunKitap = getKitapMetni(dunGorev);\n\n                const ogrKart = tumKartlar.filter(k => k.ogrenci === ogrenci);\n                let kartHTML = ogrKart.map(k => {\n                    const bilgi = kartSeviyeleri[k.isim] || { emoji: \"🏅\" };\n                    const icerik = bilgi.gorsel\n                        ? `\u003cimg src=\"${bilgi.gorsel}\" alt=\"${k.isim}\">`\n                        : bilgi.emoji;\n                    return `\u003cdiv class=\"reward-icon ${tozlanmisMi ? 'tozlu' : ''}\" title=\"${k.isim}\" data-doc=\"${k.docId}\" onclick=\"kartSecToggle(this)\">${icerik}\u003c/div>`;\n                }).join('');\n                if (kartHTML === \"\") kartHTML = \"\u003cspan style='color:#bdc3c7; font-size:11px;'>Henüz kartı yok\u003c/span>\";\n\n                // Telafi hesapla\n                const toplamEksik = ogrenciTelafiHesapla(ogrenci);\n                const telafiKaydi = tumTelafiVerisi[ogrenci] || {};\n                const manuelEk = telafiKaydi.manuelEkDakika || 0;\n                const gercekToplam = toplamEksik + manuelEk;\n                const telafiNotu = telafiKaydi.ogretmenNotu || \"\";\n                const telafiTemiz = gercekToplam === 0;\n                const gelisimHTML = ogrenciGelisimRozetiCiz(ogrenci);\n\n                const ogrDiv = document.createElement(\"div\");\n                ogrDiv.className = \"student-card\";\n                ogrDiv.innerHTML = `\n                    \u003cdiv class=\"student-name\">\n                        \u003clabel style=\"cursor:pointer; display:flex; align-items:center;\">\n                            \u003cinput type=\"checkbox\" class=\"student-cb\" value=\"${ogrenci}\"> \n                            👤 ${ogrenci}\n                        \u003c/label>\n                        ${durumRozet}\n                    \u003c/div>\n                    \n                    \u003cdiv class=\"week-badge\">📅 ${haftaBasligi}\u003c/div>\n                    \n                    \u003cdiv class=\"daily-summary\">\n                        \u003cdiv class=\"daily-item\">\u003cstrong>Bugün:\u003c/strong> \u003cbr>${bugunKitap}\u003c/div>\n                        \u003cdiv class=\"daily-item\">\u003cstrong>Dün:\u003c/strong> \u003cbr>${dunKitap}\u003c/div>\n                    \u003c/div>\n\n                    \u003cdiv class=\"weekly-stats\">\n                        \u003cspan>Bu Hafta Toplam Okuma:\u003c/span>\n                        \u003cspan>📖 ${haftalikToplamDk} dk\u003c/span>\n                    \u003c/div>\n                    \n                    \u003cdiv class=\"monthly-stats\">\n                        \u003cspan>Son 30 Gün (Aylık):\u003c/span>\n                        \u003cspan>🌟 ${aylikToplamDk} dk\u003c/span>\n                    \u003c/div>\n\n                    ${gelisimHTML}\n\n                    ${notHTML}\n\n                    \u003c!-- ===== TELAFİ YÖNETİM ALANI ===== -->\n                    \u003cdiv class=\"telafi-alani ${telafiTemiz ? 'temiz' : ''}\" id=\"telafiAlani-${idSuffix}\">\n                        \u003cdiv class=\"telafi-alani-baslik\">\n                            \u003cspan id=\"telafiBaslik-${idSuffix}\">\n                                ${telafiTemiz \n                                    ? '✅ Telafi Borcu Yok' \n                                    : `⏱️ Telafi: ${gercekToplam} dk eksik`}\n                            \u003c/span>\n                            \u003cspan id=\"telafiBadge-${idSuffix}\" class=\"${telafiTemiz ? 'telafi-temiz-badge' : 'telafi-borclu-badge'}\">\n                                ${telafiTemiz ? '✅ Telafi Yok' : `⏱️ ${gercekToplam} dk borç`}\n                            \u003c/span>\n                        \u003c/div>\n\n                        \u003cdiv style=\"font-size:11px; color:#888; margin-bottom:8px;\">\n                            Otomatik hesap: \u003cstrong>${toplamEksik} dk\u003c/strong> \n                            ${manuelEk > 0 ? ` + Öğretmen eki: \u003cstrong>${manuelEk} dk\u003c/strong>` : ''}\n                        \u003c/div>\n\n                        \u003cdiv class=\"telafi-dakika-row\">\n                            \u003cspan style=\"font-size:12px; color:#555; white-space:nowrap;\">Ekstra telafi (dk):\u003c/span>\n                            \u003cinput type=\"number\" class=\"telafi-dakika-input\" \n                                id=\"telafiInput-${idSuffix}\" \n                                value=\"${manuelEk}\" \n                                min=\"0\" placeholder=\"0\">\n                            \u003cbutton class=\"telafi-kaydet-btn\" onclick=\"telafiKaydet('${ogrenci}')\">💾 Kaydet\u003c/button>\n                            \u003cbutton class=\"telafi-sifirla-btn\" onclick=\"telafiSifirla('${ogrenci}')\">✅ Sıfırla\u003c/button>\n                        \u003c/div>\n\n                        \u003cinput type=\"text\" class=\"telafi-not-input\" \n                            id=\"telafiNot-${idSuffix}\"\n                            value=\"${telafiNotu}\"\n                            placeholder=\"Veliye not (ör: Bu hafta telafi tamamlandı)\">\n                    \u003c/div>\n\n                    \u003cdetails>\n                        \u003csummary>👁️ Geçmiş Tabloyu Gör\u003c/summary>\n                        \u003cdiv class=\"detail-content\">\n                            \u003cbutton class=\"history-btn\" onclick=\"gecmisiGoster('${ogrenci}')\">📜 Rapor Tablosunu Aç\u003c/button>\n                        \u003c/div>\n                    \u003c/details>\n\n                    \u003cdiv class=\"odev-satir\">\n                        \u003clabel>\n                            \u003cinput type=\"checkbox\" ${odevHaritasi[ogrenci] && odevHaritasi[ogrenci].yapti ? 'checked' : ''} onchange=\"odevIsaretle('${ogrenci}', this)\">\n                            📝 Bugünkü ödevini yaptı\n                        \u003c/label>\n                        \u003cdiv class=\"odev-durum ${odevDurumMetni(ogrenci).sinif}\" id=\"odevDurum-${idSuffix}\">${odevDurumMetni(ogrenci).metin}\u003c/div>\n                    \u003c/div>\n\n                    \u003cdiv style=\"font-size: 12px; font-weight:bold; margin-bottom: 5px; color: #7f8c8d;\">Kazanılan Kartlar:\u003c/div>\n                    \u003cdiv class=\"rewards-container\" id=\"kartlar-${idSuffix}\">${kartHTML}\u003c/div>\n                    \u003cdiv class=\"kart-ipucu\">Silmek için bir karta dokunup seçin, sonra 🗑️ tuşuna basın.\u003c/div>\n\n                    \u003cdiv class=\"action-area\">\n                        \u003cselect id=\"kartSec-${idSuffix}\">\n                            \u003coption value=\"İyilik Tohumu\">🌱 İyilik Tohumu\u003c/option>\n                            \u003coption value=\"İyilik Muhafızı\">🛡️ İyilik Muhafızı\u003c/option>\n                            \u003coption value=\"İyilik Çınarı\">🌳 İyilik Çınarı\u003c/option>\n                            \u003coption value=\"Çalışkan Karınca\">🐜 Çalışkan Karınca\u003c/option>\n                            \u003coption value=\"Süper Karınca\">🦸 Süper Karınca\u003c/option>\n                            \u003coption value=\"Atom Karınca\">⚛️ Atom Karınca\u003c/option>\n                        \u003c/select>\n                        \u003cbutton onclick=\"kartGonder('${ogrenci}', '${idSuffix}')\">Gönder\u003c/button>\n                        \u003cbutton style=\"background:#e74c3c;\" onclick=\"seciliKartiSil('${ogrenci}', '${idSuffix}')\" title=\"Seçili kartı sil\">🗑️ Seçiliyi Sil\u003c/button>\n                    \u003c/div>\n                `;\n                container.appendChild(ogrDiv);\n            });\n        }\n\n        // ===== TOPLU İŞLEMLER =====\n\n        window.tumunuSec = function() {\n            const cbList = document.querySelectorAll('.student-cb');\n            let hepsiSecili = Array.from(cbList).every(cb => cb.checked);\n            cbList.forEach(cb => cb.checked = !hepsiSecili);\n        }\n\n        window.tumSinifaKartGonder = async function() {\n            const kartIsmi = document.getElementById('topluKartSec').value;\n            if(!confirm(`⚠️ DİKKAT! ${aktifSinif} sınıfındaki TÜM ÖĞRENCİLERE '${kartIsmi}' kartı gönderilecek. Emin misiniz?`)) return;\n            document.getElementById(\"loading\").style.display = \"block\";\n            try {\n                let sozler = siniflar[aktifSinif].map(ogr => addDoc(collection(db, \"ogrenciKartlari\"), { ogrenci: ogr, isim: kartIsmi, tarih: new Date() }));\n                await Promise.all(sozler);\n                alert(\"✅ Sınıftaki herkese kart gönderildi!\");\n                verileriGetir();\n            } catch(e) {\n                console.error(\"Kart gönderme hatası:\", e);\n                alert(`❌ Kart gönderilemedi!\\n\\nHata: ${e.message}\\n\\nBu genelde Firebase Firestore güvenlik kurallarından (Security Rules) kaynaklanır. Firebase konsolunda \"ogrenciKartlari\" koleksiyonuna yazma izni olduğunu kontrol edin.`);\n                document.getElementById(\"loading\").style.display = \"none\";\n            }\n        }\n\n        window.secilenlereKartGonder = async function() {\n            const secilenler = Array.from(document.querySelectorAll('.student-cb:checked')).map(cb => cb.value);\n            if(secilenler.length === 0) return alert(\"❌ Lütfen önce kutucukları işaretleyerek öğrenci seçin!\");\n            const kartIsmi = document.getElementById('topluKartSec').value;\n            document.getElementById(\"loading\").style.display = \"block\";\n            try {\n                let sozler = secilenler.map(ogr => addDoc(collection(db, \"ogrenciKartlari\"), { ogrenci: ogr, isim: kartIsmi, tarih: new Date() }));\n                await Promise.all(sozler);\n                alert(`✅ Seçilen ${secilenler.length} öğrenciye kart gönderildi!`);\n                verileriGetir();\n            } catch(e) {\n                console.error(\"Kart gönderme hatası:\", e);\n                alert(`❌ Kart gönderilemedi!\\n\\nHata: ${e.message}\\n\\nBu genelde Firebase Firestore güvenlik kurallarından (Security Rules) kaynaklanır. Firebase konsolunda \"ogrenciKartlari\" koleksiyonuna yazma izni olduğunu kontrol edin.`);\n                document.getElementById(\"loading\").style.display = \"none\";\n            }\n        }\n\n        window.kartGonder = async function(ogrenciIsmi, idSuffix) {\n            const secilenKart = document.getElementById(`kartSec-${idSuffix}`).value;\n            try {\n                await addDoc(collection(db, \"ogrenciKartlari\"), { ogrenci: ogrenciIsmi, isim: secilenKart, tarih: new Date() });\n                alert(`✅ ${secilenKart} gönderildi!`);\n                verileriGetir();\n            } catch(e) {\n                console.error(\"Kart gönderme hatası:\", e);\n                alert(`❌ Kart gönderilemedi!\\n\\nHata: ${e.message}\\n\\nBu genelde Firebase Firestore güvenlik kurallarından (Security Rules) kaynaklanır. Firebase konsolunda \"ogrenciKartlari\" koleksiyonuna yazma izni olduğunu kontrol edin.`);\n            }\n        };\n\n        window.kartSecToggle = function(el) {\n            const zatenSecili = el.classList.contains('secili');\n            el.parentElement.querySelectorAll('.reward-icon').forEach(x => x.classList.remove('secili'));\n            if (!zatenSecili) el.classList.add('secili');\n        };\n\n        // Yalnızca seçili kartı siler (öğrencinin diğer kartlarına dokunmaz)\n        window.seciliKartiSil = async function(ogr, idSuffix) {\n            const kap = document.getElementById(`kartlar-${idSuffix}`);\n            const sec = kap ? kap.querySelector('.reward-icon.secili') : null;\n            if (!sec) return alert(\"Önce silmek istediğiniz kartın üzerine dokunarak seçin.\");\n            const kartAdi = sec.title;\n            if (!confirm(`${ogr} adlı öğrencinin seçili \"${kartAdi}\" kartı silinecek. Emin misiniz?`)) return;\n            try {\n                await deleteDoc(doc(db, \"ogrenciKartlari\", sec.dataset.doc));\n                tumKartlar = tumKartlar.filter(k => k.docId !== sec.dataset.doc);\n                sinifYukle(aktifSinif);\n            } catch (e) {\n                console.error(\"Kart silme hatası:\", e);\n                alert(`❌ Kart silinemedi!\\n\\nHata: ${e.message}`);\n            }\n        };\n\n        // ===== RAPOR MODAL =====\n\n        window.gecmisiGoster = function(ogrenci) {\n            seciliOgrenciRapor = ogrenci;\n            document.getElementById(\"modalTitle\").innerText = `📊 ${ogrenci} - Okuma Raporu`;\n            document.getElementById(\"historyModal\").style.display = \"block\";\n            raporCiz(7); \n        };\n\n        window.raporCiz = function(gunSayisi) {\n            document.getElementById(\"btnHafta\").classList.remove(\"active\");\n            document.getElementById(\"btnAy\").classList.remove(\"active\");\n            if(gunSayisi === 7) document.getElementById(\"btnHafta\").classList.add(\"active\");\n            else document.getElementById(\"btnAy\").classList.add(\"active\");\n\n            const ogrGorevleri = tumGorevler.filter(g => g.ogrenci === seciliOgrenciRapor);\n            const suAn = new Date().getTime();\n            \n            let donemToplamKitap = 0;\n            let donemToplamEksik = 0;\n\n            const filtrelenmis = ogrGorevleri.filter(g => {\n                const fark = (suAn - g.tamZaman) / (1000 * 60 * 60 * 24);\n                return fark \u003c= gunSayisi;\n            });\n\n            if(filtrelenmis.length === 0) {\n                document.getElementById(\"modalBody\").innerHTML = `\u003cp style=\"text-align:center; margin-top:20px;\">Son ${gunSayisi} güne ait hiçbir kayıt bulunamadı.\u003c/p>`;\n                return;\n            }\n\n            let html = `\n            \u003ctable class=\"report-table\">\n                \u003cthead>\n                    \u003ctr>\n                        \u003cth>Tarih\u003c/th>\n                        \u003cth>Kitap Sayısı\u003c/th>\n                        \u003cth>Okuma (dk)\u003c/th>\n                        \u003cth>Telafi\u003c/th>\n                        \u003cth>Okunan Kitaplar\u003c/th>\n                        \u003cth>Öğretmen Notu\u003c/th>\n                    \u003c/tr>\n                \u003c/thead>\n                \u003ctbody>\n            `;\n\n            filtrelenmis.forEach(g => {\n                let notMetni = g.veliNotu ? g.veliNotu : \"-\";\n                let tarihKisa = g.tarihMetni ? g.tarihMetni.split(\" \")[0] : \"-\"; \n                let kitapMetni = getKitapMetni(g);\n                let kitapSayisi = g.okunanKitaplar ? g.okunanKitaplar.length : 0;\n                donemToplamKitap += kitapSayisi;\n\n                let gunSure = 0;\n                if(g.okunanKitaplar) {\n                    g.okunanKitaplar.forEach(k => { gunSure += parseInt(k.okumaSuresi) || 0; });\n                }\n                const eksik = Math.max(0, MIN_OKUMA_DK - gunSure);\n                donemToplamEksik += eksik;\n\n                const sureCellStyle = gunSure \u003c MIN_OKUMA_DK \n                    ? 'color:#e74c3c; font-weight:bold;' \n                    : 'color:#27ae60; font-weight:bold;';\n                \n                const eksikHtml = eksik > 0 \n                    ? `\u003cspan style=\"color:#e74c3c; font-size:11px;\">-${eksik} dk\u003c/span>` \n                    : `\u003cspan style=\"color:#27ae60; font-size:11px;\">✅\u003c/span>`;\n\n                html += `\n                    \u003ctr>\n                        \u003ctd style=\"font-weight:bold;\">${tarihKisa}\u003c/td>\n                        \u003ctd style=\"font-weight:bold; color:#0984e3;\">📚 ${kitapSayisi}\u003c/td>\n                        \u003ctd style=\"${sureCellStyle}\">${gunSure} dk\u003c/td>\n                        \u003ctd>${eksikHtml}\u003c/td>\n                        \u003ctd>${kitapMetni}\u003c/td>\n                        \u003ctd style=\"font-size:11px; max-width:150px;\">${notMetni}\u003c/td>\n                    \u003c/tr>\n                `;\n            });\n\n            html += `\u003c/tbody>\u003c/table>`;\n            \n            let ozetHtml = `\n                \u003cdiv class=\"total-tick-summary\">\n                    Son ${gunSayisi} günde toplam \u003cstrong>${donemToplamKitap} kitap\u003c/strong> okundu 🎉 &nbsp;|&nbsp; \n                    Toplam \u003cstrong style=\"color:#e17055;\">${donemToplamEksik} dk\u003c/strong> telafi birikti ⏱️\n                \u003c/div>`;\n            \n            document.getElementById(\"modalBody\").innerHTML = ozetHtml + html;\n        };\n\n        window.modaliKapat = () => document.getElementById(\"historyModal\").style.display = \"none\";\n        \n        window.csvIndir = function() {\n            const ogrGorevleri = tumGorevler.filter(g => g.ogrenci === seciliOgrenciRapor);\n            if(ogrGorevleri.length === 0) return alert(\"İndirilecek kayıt yok.\");\n            \n            let csv = \"data:text/csv;charset=utf-8,\\uFEFFTarih,Kitap Sayisi,Okuma Suresi (dk),Telafi (dk),Okunan Kitaplar,Veli Notu\\r\\n\";\n            \n            ogrGorevleri.forEach(g => {\n                let kitaplarListesi = \"-\";\n                if(g.okunanKitaplar && g.okunanKitaplar.length > 0) {\n                    kitaplarListesi = g.okunanKitaplar.map(k => `${k.kitapAdi} (${k.sayfaSayisi}syf / ${k.okumaSuresi}dk)`).join(' | ');\n                }\n                \n                let kitapSayisi = g.okunanKitaplar ? g.okunanKitaplar.length : 0;\n                let gunSure = 0;\n                if(g.okunanKitaplar) g.okunanKitaplar.forEach(k => { gunSure += parseInt(k.okumaSuresi)||0; });\n                const eksik = Math.max(0, MIN_OKUMA_DK - gunSure);\n\n                csv += `${g.tarihMetni},${kitapSayisi},${gunSure},${eksik},\"${kitaplarListesi}\",\"${g.veliNotu||\"-\"}\"\\r\\n`;\n            });\n\n            const link = document.createElement(\"a\");\n            link.href = encodeURI(csv); link.download = `${seciliOgrenciRapor.replace(/\\s+/g,'_')}_Rapor.csv`;\n            document.body.appendChild(link); link.click(); document.body.removeChild(link);\n        };\n        \n        window.onload = verileriGetir;\n    \u003c/script>\n\u003c/body>\n\u003c/html>\n" };

        window.goLogin = function () { location.hash = ""; };

        function sayfaGoster(ad, sorgu) {
            const html = SAYFALAR[ad].replace('<head>', '<head><script>window.__q=' + JSON.stringify(sorgu) + ';<\/script>');
            const f = document.getElementById("appFrame");
            f.srcdoc = html;
            f.style.display = "block";
            document.getElementById("loginView").style.display = "none";
            window.scrollTo(0, 0);
        }

        function yonlendir() {
            const h = location.hash.slice(1);
            const f = document.getElementById("appFrame");
            if (h.startsWith("veli/")) {
                let ad = "";
                try { ad = decodeURIComponent(h.slice(5)); } catch (e) {}
                if (ad) return sayfaGoster("veli", "ogrenci=" + encodeURIComponent(ad));
            } else if (h === "ogretmen") {
                return sayfaGoster("ogretmen", "");
            }
            // giriş ekranı
            f.style.display = "none"; f.removeAttribute("srcdoc"); f.src = "about:blank";
            document.getElementById("loginView").style.display = "block";
            modaliKapat();
        }
        window.addEventListener("hashchange", yonlendir);
        document.addEventListener("DOMContentLoaded", yonlendir);
    </script>
</body>
</html>
